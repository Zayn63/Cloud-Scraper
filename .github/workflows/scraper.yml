name: UAE Restaurant Lead Generation Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Data
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Initialize Python Core
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure Playwright Web Drivers
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run Scraper Engine Task
      run: python $(find . -name "trip.py" -print -quit)

    # 🚀 BULLETPROOF AUTOMATED CLOUD UPLOAD FIX
    - name: Auto Save and Push CSV File Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Sync: Updated UAE Restaurant Lead Sheets"
        file_pattern: 'tripadvisor_output.csv'

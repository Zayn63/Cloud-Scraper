name: UAE Restaurant Lead Generation Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Repository Data
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Initialize Python Core
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Configure Playwright Web Drivers
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run Scraper Engine Task
      run: xvfb-run -a --server-args="-screen 0 1440x900x24" python Trip.py

    - name: Auto Save and Push CSV File Changes
      if: always()
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Sync: Updated UAE Restaurant Lead Sheets"
        file_pattern: 'tripadvisor_output.csv'

    - name: Upload debug files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug
        path: |
          debug/
          tripadvisor_output.csv
        if-no-files-found: ignore

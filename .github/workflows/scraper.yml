name: TripAdvisor Restaurant Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -u tripadvisor_scraper.py

      - name: Upload master CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripadvisor-master-csv
          path: pyt_name_email.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated CSV
        if: success()
        run: |
          if git diff --quiet -- pyt_name_email.csv; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyt_name_email.csv
          git commit -m "Update restaurant master CSV"
          git push
